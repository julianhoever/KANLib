[project]
name = "kanlib"
version = "0.1.0"
description = "Predefined modules to build KANs with PyTorch."
readme = "README.md"
authors = [
    { name = "Julian Hoever", email = "julianhoever@posteo.de" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "types-tqdm>=4.70.0.20260906",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
